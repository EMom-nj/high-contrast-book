<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신생아 초점책 메이커 (E맘)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fa-solid fa-book-open"></i> 신생아 초점책 메이커 (E맘)</h1>
            <p>세상에 처음 나온 아기를 위한 흑백 초점책을 만들어보세요. 다운로드 후 A4 용지에 인쇄하여 사용할 수 있습니다.</p>
        </header>

        <main>
            <!-- Controls Section -->
            <section class="controls-panel">
                <div class="input-group">
                    <label for="input-name" style="display: flex; justify-content: space-between; align-items: center;">
                        <span><i class="fa-solid fa-baby"></i> 아기 이름 (영문)</span>
                        <label style="font-weight: normal; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; cursor: pointer; margin: 0;">
                            <input type="checkbox" id="check-picture-book" checked> 그림책 모드 (이름 숨기기)
                        </label>
                    </label>
                    <input type="text" id="input-name" placeholder="예: LOVE" maxlength="20" value="LOVE">
                </div>

                <div class="input-group">
                    <label for="select-layout"><i class="fa-solid fa-border-all"></i> 페이지 레이아웃</label>
                    <select id="select-layout">
                        <option value="1">1개 (아주 크게)</option>
                        <option value="4" selected>2x2 격자 (보통 크기)</option>
                        <option value="9">3x3 격자 (작은 크기)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="select-theme"><i class="fa-solid fa-star"></i> 페이지 테마</label>
                    <select id="select-theme">
                        <option value="theme-none" selected>없음 (기본)</option>
                        <option value="theme-bear">테디베어 (Teddy Bears)</option>
                        <option value="theme-paw">발자국 (Paws)</option>
                        <option value="theme-nature">자연 (Nature)</option>
                        <option value="theme-space">우주 (Space)</option>
                        <option value="theme-zoo">동물원 (Zoo)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="select-border"><i class="fa-solid fa-square"></i> 테두리 모양</label>
                    <select id="select-border">
                        <option value="border-solid" selected>기본 선 (Solid)</option>
                        <option value="border-rounded">둥근 모서리 (Rounded)</option>
                        <option value="border-dashed">파선 (Dashed)</option>
                        <option value="border-double">이중선 (Double)</option>
                        <option value="border-dotted">물결/점선 (Dotted)</option>
                    </select>
                </div>

                <div class="button-group">
                    <button id="btn-add-shapes" class="btn btn-secondary"><i class="fa-solid fa-dice"></i> 패턴 채우기</button>
                    <button id="btn-download" class="btn btn-primary"><i class="fa-solid fa-file-pdf"></i> PDF 다운로드</button>
                </div>
            </section>

            <!-- Live Preview Section -->
            <section class="preview-section">
                <h2>실시간 미리보기</h2>
                <p class="desc">실제 인쇄될 형태입니다. 이름이 길면 자동으로 여러 페이지가 생성됩니다.</p>
                <div id="pdf-document">
                    <!-- Dynamic .pdf-page elements will be inserted here -->
                </div>
            </section>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
